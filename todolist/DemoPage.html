<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="오늘의 할 일을 가볍게 정리하는 Todoistly">
  <title>Todoistly | 오늘의 할 일</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['Georgia', 'serif'], sans: ['Trebuchet MS', 'sans-serif'] },
          boxShadow: { soft: '0 18px 50px rgba(90, 68, 86, 0.10)' }
        }
      }
    };
  </script>
  <style>
    :root { --ink: #393346; --muted: #7d7485; --cream: #fffaf4; --pink: #f7cbd0; --mint: #cde9df; --lavender: #ddd5f2; }
    body { color: var(--ink); background: var(--cream); font-family: 'Trebuchet MS', sans-serif; }
    .paper-grid { background-image: linear-gradient(rgba(214, 197, 202, .17) 1px, transparent 1px), linear-gradient(90deg, rgba(214, 197, 202, .17) 1px, transparent 1px); background-size: 28px 28px; }
    .task-enter { animation: task-enter .35s ease both; }
    @keyframes task-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .checkmark { transition: transform .2s ease, opacity .2s ease; }
    .task-card:hover .delete-button { opacity: 1; }
    @media (max-width: 640px) { .delete-button { opacity: 1; } }
  </style>
</head>
<body class="min-h-screen paper-grid">
  <div class="mx-auto min-h-screen max-w-6xl px-4 py-6 sm:px-8 sm:py-10">
    <header class="mb-8 flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="mb-2 text-xs font-bold uppercase tracking-[0.24em] text-rose-400">A softer way to plan</p>
        <h1 class="font-display text-5xl leading-none text-[#393346] sm:text-6xl">Todoistly<span class="text-rose-300">.</span></h1>
        <p id="today-label" class="mt-3 text-sm text-[#7d7485]"></p>
      </div>
      <div class="w-full max-w-xs rounded-3xl border border-white bg-white/70 p-4 shadow-soft backdrop-blur sm:w-64">
        <div class="mb-2 flex items-center justify-between text-xs font-bold text-[#7d7485]"><span>오늘의 진행률</span><span id="progress-label">0%</span></div>
        <div class="h-3 overflow-hidden rounded-full bg-[#f5e8e6]"><div id="progress-bar" class="h-full rounded-full bg-[#f2abb7] transition-all duration-500" style="width: 0%"></div></div>
      </div>
    </header>

    <main>
      <section class="mb-6 grid grid-cols-1 gap-3 sm:grid-cols-3" aria-label="할 일 통계">
        <div class="rounded-3xl bg-[#f7cbd0] p-5 shadow-soft"><p class="text-xs font-bold uppercase tracking-widest text-[#795761]">전체</p><p id="total-count" class="mt-2 text-3xl font-bold">0</p></div>
        <div class="rounded-3xl bg-[#cde9df] p-5 shadow-soft"><p class="text-xs font-bold uppercase tracking-widest text-[#4a7066]">진행 중</p><p id="active-count" class="mt-2 text-3xl font-bold">0</p></div>
        <div class="rounded-3xl bg-[#ddd5f2] p-5 shadow-soft"><p class="text-xs font-bold uppercase tracking-widest text-[#665b80]">완료</p><p id="completed-count" class="mt-2 text-3xl font-bold">0</p></div>
      </section>

      <section class="rounded-[2rem] border border-white bg-white/80 p-4 shadow-soft backdrop-blur sm:p-7">
        <form id="todo-form" class="flex flex-col gap-3 sm:flex-row" autocomplete="off">
          <label class="sr-only" for="todo-input">새 할 일</label>
          <input id="todo-input" class="min-w-0 flex-1 rounded-2xl border-2 border-[#f2e7e4] bg-[#fffaf8] px-5 py-4 text-base outline-none transition placeholder:text-[#b9aeb7] focus:border-[#e8aab6] focus:ring-4 focus:ring-[#f7cbd0]/50" type="text" maxlength="120" placeholder="오늘 마음에 남은 일을 적어보세요" required>
          <button class="rounded-2xl bg-[#393346] px-7 py-4 font-bold text-white transition hover:bg-[#51465f] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[#f7cbd0]" type="submit">할 일 추가 <span aria-hidden="true">+</span></button>
        </form>

        <div class="mt-7 flex flex-col gap-4 border-b border-[#eee5e4] pb-5 sm:flex-row sm:items-center sm:justify-between">
          <div class="flex items-center gap-1 rounded-2xl bg-[#f9f2f0] p-1" role="group" aria-label="할 일 필터">
            <button class="filter-button rounded-xl px-3 py-2 text-sm font-bold transition" data-filter="all" type="button">전체</button>
            <button class="filter-button rounded-xl px-3 py-2 text-sm font-bold text-[#8b7e87] transition" data-filter="active" type="button">진행 중</button>
            <button class="filter-button rounded-xl px-3 py-2 text-sm font-bold text-[#8b7e87] transition" data-filter="completed" type="button">완료</button>
          </div>
          <div class="flex gap-3">
            <label class="relative flex-1 sm:w-52"><span class="sr-only">할 일 검색</span><span class="pointer-events-none absolute left-3 top-2.5 text-[#a79ba4]" aria-hidden="true">⌕</span><input id="search-input" class="w-full rounded-xl border border-[#eee5e4] bg-white px-3 py-2 pl-8 text-sm outline-none focus:border-[#e8aab6]" type="search" placeholder="검색"></label>
            <button id="clear-completed" class="whitespace-nowrap rounded-xl px-3 py-2 text-sm font-bold text-[#a17b82] transition hover:bg-[#fff0ef] disabled:cursor-not-allowed disabled:opacity-40" type="button">완료 삭제</button>
          </div>
        </div>

        <div id="empty-state" class="hidden py-16 text-center"><div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-[#fff0ef] text-2xl" aria-hidden="true">♡</div><h2 class="font-display text-2xl">아직 보이는 할 일이 없어요</h2><p class="mt-2 text-sm text-[#8b7e87]">새로운 하루를 위한 첫 번째 일을 적어보세요.</p></div>
        <ul id="todo-list" class="mt-5 space-y-3" aria-live="polite"></ul>
      </section>
    </main>
    <footer class="py-8 text-center text-xs text-[#a79ba4]">작은 체크 하나가 하루의 리듬을 만듭니다.</footer>
  </div>

  <script>
    const STORAGE_KEY = 'todoistly-items-v1';
    let todos = loadTodos();
    let currentFilter = 'all';
    let searchTerm = '';
    const elements = { list: document.querySelector('#todo-list'), empty: document.querySelector('#empty-state'), input: document.querySelector('#todo-input'), search: document.querySelector('#search-input'), total: document.querySelector('#total-count'), active: document.querySelector('#active-count'), completed: document.querySelector('#completed-count'), progress: document.querySelector('#progress-bar'), progressLabel: document.querySelector('#progress-label'), clear: document.querySelector('#clear-completed') };

    function loadTodos() { try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); return Array.isArray(saved) ? saved : []; } catch (error) { return []; } }
    function saveTodos() { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }
    function visibleTodos() { return todos.filter(todo => (currentFilter === 'all' || (currentFilter === 'active' ? !todo.completed : todo.completed)) && todo.title.toLowerCase().includes(searchTerm.toLowerCase())); }
    function render() {
      const completed = todos.filter(todo => todo.completed).length;
      const active = todos.length - completed;
      const percent = todos.length ? Math.round(completed / todos.length * 100) : 0;
      elements.total.textContent = todos.length; elements.active.textContent = active; elements.completed.textContent = completed; elements.progress.style.width = percent + '%'; elements.progressLabel.textContent = percent + '%'; elements.clear.disabled = completed === 0;
      const items = visibleTodos(); elements.list.innerHTML = items.map(todo => `<li class="task-card task-enter flex items-center gap-3 rounded-2xl border border-[#eee5e4] bg-white px-4 py-4 transition hover:-translate-y-0.5 hover:shadow-md"><input class="h-5 w-5 shrink-0 accent-[#e8aab6]" type="checkbox" data-action="toggle" data-id="${todo.id}" ${todo.completed ? 'checked' : ''} aria-label="${escapeHtml(todo.title)} 완료 여부"><span class="min-w-0 flex-1 break-words text-[15px] ${todo.completed ? 'text-[#aaa0a9] line-through' : ''}">${escapeHtml(todo.title)}</span><button class="delete-button shrink-0 rounded-lg px-2 py-1 text-lg leading-none text-[#b999a2] opacity-0 transition hover:bg-[#fff0ef] hover:text-[#9d5d69] focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#f2abb7]" data-action="delete" data-id="${todo.id}" type="button" aria-label="${escapeHtml(todo.title)} 삭제">×</button></li>`).join(''); elements.empty.classList.toggle('hidden', items.length > 0); document.querySelectorAll('.filter-button').forEach(button => { const selected = button.dataset.filter === currentFilter; button.classList.toggle('bg-white', selected); button.classList.toggle('text-[#393346]', selected); button.classList.toggle('shadow-sm', selected); });
    }
    function escapeHtml(value) { return value.replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' }[character])); }
    document.querySelector('#todo-form').addEventListener('submit', event => { event.preventDefault(); const title = elements.input.value.trim(); if (!title) return; todos.unshift({ id: Date.now(), title, completed: false, createdAt: new Date().toISOString() }); saveTodos(); elements.input.value = ''; render(); elements.input.focus(); });
    elements.list.addEventListener('click', event => { const target = event.target.closest('[data-action]'); if (!target) return; const id = Number(target.dataset.id); if (target.dataset.action === 'delete') todos = todos.filter(todo => todo.id !== id); saveTodos(); render(); });
    elements.list.addEventListener('change', event => { if (event.target.dataset.action !== 'toggle') return; const todo = todos.find(item => item.id === Number(event.target.dataset.id)); if (todo) todo.completed = event.target.checked; saveTodos(); render(); });
    document.querySelectorAll('.filter-button').forEach(button => button.addEventListener('click', () => { currentFilter = button.dataset.filter; render(); }));
    elements.search.addEventListener('input', event => { searchTerm = event.target.value.trim(); render(); });
    elements.clear.addEventListener('click', () => { todos = todos.filter(todo => !todo.completed); saveTodos(); render(); });
    document.querySelector('#today-label').textContent = new Intl.DateTimeFormat('ko-KR', { dateStyle: 'full' }).format(new Date());
    render();
  </script>
</body>
</html>
